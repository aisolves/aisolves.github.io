<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>高鐵 × 國光｜台北轉乘器｜AI 有解</title><style>body{font:16px system-ui,sans-serif;background:#f4f6fa;color:#17253b;margin:0}main{max-width:850px;margin:auto;padding:24px}section{background:white;border-radius:16px;padding:20px;margin:16px 0}label{display:block;margin:12px 0}input,select,textarea,button{font:inherit;box-sizing:border-box;padding:10px;border:1px solid #a9b5c5;border-radius:8px}textarea{width:100%;min-height:100px}button{background:#173b60;color:white;cursor:pointer}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}a{color:#175c9b}.scroll{overflow:auto}</style><main><a href="/">← AI 有解首頁</a><h1>高鐵 × 國光｜台北轉乘器</h1><p>GitHub 靜態測試版 · 台北接駁 · 資料僅在瀏覽器處理</p><section><strong>目前尚未匯入官方時刻表。</strong><p>本頁可用自行匯入的當日班次計算轉乘，並非即時查詢。<a href="https://thsr-kuokuang-taipei-transfer.peachy-harp-9875.chatgpt.site/">開啟原正式工具</a></p></section><section><label>第一段班次（每行：班次,出發時間,抵達轉乘站時間）<textarea id="a" placeholder="班次A,07:00,08:00"></textarea></label><label>第二段班次（每行：班次,離開轉乘站時間,終點抵達時間）<textarea id="b" placeholder="班次B,08:10,09:00"></textarea></label><label>最少轉乘分鐘 <input id="min" type="number" min="0" max="1440" value="10"></label><label>最多轉乘分鐘 <input id="max" type="number" min="0" max="1440" value="60"></label><button id="go">計算接駁</button><p id="msg" role="status"></p><div class="scroll"><table><thead><tr><th>第一段</th><th>第二段</th><th>出發</th><th>抵達</th><th>轉乘</th><th>全程</th></tr></thead><tbody id="out"></tbody></table></div></section><p>請按實際行車方向及日期匯入班次；目前只支援同日班次，不含跨午夜、誤點或座位資訊。</p></main><script>const $=id=>document.getElementById(id);function t(s){if(!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(s))throw Error('時間須為 HH:MM');let [h,m]=s.split(':').map(Number);return h*60+m}function parse(id){return $(id).value.split(/\r?\n/).filter(x=>x.trim()).map((x,i)=>{let p=x.split(',').map(y=>y.trim());if(p.length!==3||!p[0])throw Error('第 '+(i+1)+' 行格式錯誤');let d=t(p[1]),a=t(p[2]);if(a<d)throw Error('不支援跨午夜或逆序班次');return {n:p[0],d,a,ds:p[1],as:p[2]}})}$('go').onclick=()=>{let out=$('out');out.replaceChildren();try{let a=parse('a'),b=parse('b'),lo=Number($('min').value),hi=Number($('max').value);if(!a.length||!b.length)throw Error('請輸入兩段班次');if(!$('min').value||!$('max').value||!Number.isInteger(lo)||!Number.isInteger(hi)||lo<0||hi<lo||hi>1440)throw Error('請確認轉乘時間範圍');let r=[];for(let x of a)for(let y of b){let w=y.d-x.a;if(w>=lo&&w<=hi)r.push([x,y,w])}r.sort((p,q)=>p[0].d-q[0].d||p[1].a-q[1].a);for(let [x,y,w] of r){let tr=out.insertRow();for(let v of [x.n,y.n,x.ds,y.as,w+' 分',y.a-x.d+' 分'])tr.insertCell().textContent=v}$('msg').textContent='找到 '+r.length+' 個方案'}catch(e){$('msg').textContent=e.message}};</script></html>
